# Send prefix
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch 
bind -n S-Left previous-window
bind -n S-Right next-window

# Mouse mode - 允许鼠标滚屏、调整 pane、切换 pane
set -g mouse on
set -g set-clipboard off


# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# buffer 缓存复制到 Mac 系统剪贴板
bind C-c run "tmux save-buffer - | pbcopy"
# Mac 系统剪贴板内容粘贴到会话
bind C-v run "pbpaste | tmux load-buffer - \; paste-buffer -d"

# vi 模式下按 y 复制选中文本到 Mac 剪贴板
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'
# 鼠标拖拽选中文本松开后，自动复制到 Mac 剪贴板（vi + emacs 两个表都绑）
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"






source-file "$HOME/.config/kaku/tmux/kaku.tmux.conf" # Kaku tmux Integration

# ============================================================
# tmux 会话自动保存与重启恢复（来自知乎文章方案）
# 参考：https://zhuanlan.zhihu.com/p/146544540
#   - tpm:             tmux 插件管理器
#   - tmux-resurrect:  保存/恢复 tmux 会话
#   - tmux-continuum:  定时自动保存 + 启动自动恢复
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 每 15 分钟自动保存一次会话
set -g @continuum-save-interval '15'
# tmux 启动时自动恢复上次保存的会话
set -g @continuum-restore 'on'
# 同时保存 pane 中显示的内容
set -g @resurrect-capture-pane-contents 'on'

# 必须放在配置文件最末尾：启动 tpm
run -b '~/.tmux/plugins/tpm/tpm'
